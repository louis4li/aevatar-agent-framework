syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Aevatar.Silo.Messages";

// ========== Kafka Stream Messages ==========

message KafkaMessageEvent {
    string message_id = 1;
    string topic = 2;
    string content = 3;
    google.protobuf.Timestamp timestamp = 4;
    string sender_id = 5;
    map<string, string> metadata = 6;
}

message KafkaProducerState {
    int32 messages_published = 1;
    int64 total_bytes_sent = 2;
    google.protobuf.Timestamp last_publish_time = 3;
    string topic_name = 4;
}

message KafkaConsumerState {
    int32 messages_consumed = 1;
    int64 total_bytes_received = 2;
    google.protobuf.Timestamp last_consume_time = 3;
    string subscription_status = 4;
}

// ========== Event Sourcing Messages ==========

message AccountCreated {
    string account_holder = 1;
    double initial_balance = 2;
    string account_id = 3;
    google.protobuf.Timestamp created_at = 4;
}

message MoneyDeposited {
    double amount = 1;
    string description = 2;
    google.protobuf.Timestamp deposited_at = 3;
}

message MoneyWithdrawn {
    double amount = 1;
    string description = 2;
    google.protobuf.Timestamp withdrawn_at = 3;
}

message BankAccountState {
    string account_id = 1;
    string account_holder = 2;
    double balance = 3;
    int32 transaction_count = 4;
    google.protobuf.Timestamp last_transaction_time = 5;
    google.protobuf.Timestamp created_at = 6;
}

// ========== Metrics Messages ==========

message MetricsReport {
    string agent_id = 1;
    string agent_type = 2;
    map<string, double> metrics = 3;
    google.protobuf.Timestamp timestamp = 4;
}

