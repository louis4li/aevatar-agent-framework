syntax = "proto3";

package business.server;

import "google/protobuf/timestamp.proto";

// ========== Agent States ==========

// Simple Business Agent State
message SimpleBusinessAgentState {
    string agent_id = 1;
    int32 processed_events_count = 2;
    string last_message = 3;
    google.protobuf.Timestamp last_updated = 4;
}

// ========== Event Messages ==========

// Business Message Event
message BusinessMessageEvent {
    string message_id = 1;
    string content = 2;
    google.protobuf.Timestamp timestamp = 3;
}

// Business Response Event
message BusinessResponseEvent {
    string response_id = 1;
    string original_message_id = 2;
    string response = 3;
    google.protobuf.Timestamp timestamp = 4;
}

